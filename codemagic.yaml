workflows:
  android-release:
    name: Android Release
    max_build_duration: 60
    environment:
      flutter: stable
      android_signing:
        - flayr_keystore
      vars:
        PACKAGE_NAME: "com.flowachat.yan"
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build Android release APK
        script: |
          flutter build apk --release \
            --build-name=1.25 \
            --build-number=$(($(google-play get-latest-build-number --package-name "$PACKAGE_NAME" --tracks=alpha) + 1))
      - name: Build Android App Bundle (AAB)
        script: |
          flutter build appbundle --release \
            --build-name=1.25
    artifacts:
      - build/app/outputs/flutter-apk/app-release.apk
      - build/app/outputs/bundle/release/app-release.aab
    publishing:
      email:
        recipients:
          - yanroovenandrewoccine@gmail.com

  ios-release:
    name: iOS Release
    max_build_duration: 90
    environment:
      flutter: stable
      vars:
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"
    scripts:
      - name: Disable Swift Package Manager (plugins not compatible)
        script: flutter config --no-enable-swift-package-manager
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods dependencies
        script: cd ios && pod install --repo-update
      - name: Build iOS (unsigned — for sideloading)
        script: |
          flutter build ios --release --no-codesign
          cd ios && xcodebuild \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            -archivePath build/Runner.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE=""
      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/unsigned
          cd ios/build/Runner.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r $CM_BUILD_DIR/build/ios/unsigned/flayr-unsigned.ipa Payload
    artifacts:
      - build/ios/unsigned/flayr-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - yanroovenandrewoccine@gmail.com
