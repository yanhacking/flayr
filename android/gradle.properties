org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError -XX:+UseG1GC
android.useAndroidX=true
android.enableJetifier=true
# Exclude Flutter's own debug JARs from Jetifier — they don't need transformation and are huge
android.jetifier.ignorelist=x86_debug,x86_64_debug,arm64_v8a_debug,armeabi_v7a_debug
android.nonTransitiveRClass=false
android.nonFinalResIds=false
android.ndk.suppressMinSdkVersionError=21
org.gradle.parallel=true
org.gradle.caching=true
