plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

//def flutterRoot = localProperties.getProperty('flutter.sdk')
//if (flutterRoot == null) {
//    throw new GradleException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
//}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// ── Signing ───────────────────────────────────────────────────────────────
// Local: create android/key.properties with keyAlias/keyPassword/storeFile/storePassword
// CI/CD (CodeMagic): set CM_KEYSTORE_PATH, CM_KEY_ALIAS, CM_KEY_PASSWORD, CM_KEYSTORE_PASSWORD
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def cmKeystorePath     = System.getenv('CM_KEYSTORE_PATH')
def cmKeyAlias         = System.getenv('CM_KEY_ALIAS')
def cmKeyPassword      = System.getenv('CM_KEY_PASSWORD')
def cmKeystorePassword = System.getenv('CM_KEYSTORE_PASSWORD')

android {
    compileSdk 36
    ndkVersion = "28.2.13676358"
    namespace 'com.flowachat.yan'

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            if (cmKeystorePath != null) {
                // CodeMagic CI/CD
                storeFile     file(cmKeystorePath)
                storePassword cmKeystorePassword
                keyAlias      cmKeyAlias
                keyPassword   cmKeyPassword
            } else if (keystorePropertiesFile.exists()) {
                // Local build with key.properties
                storeFile     file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias      keystoreProperties['keyAlias']
                keyPassword   keystoreProperties['keyPassword']
            } else {
                // Fallback to debug keys (dev only — never publish this)
                signingConfig = signingConfigs.debug
            }
        }
    }

    defaultConfig {
        applicationId "com.flowachat.yan"
        minSdkVersion 24
        multiDexEnabled true
        targetSdkVersion 36
        versionCode 28
        versionName "1.25"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation 'com.android.support:multidex:1.0.3'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
